<html>
    <head>
        <style>
            body{
                text-align:center;
            }
        </style>
    </head>
    <body>
        <div>
            <h2>Uniqe value </h2>
            <p id="array"></p>
            <button onclick="find()">find</button>
            <p id="resulte"></p>
        </div>
        <script>
            let arr = [1,2,3,3,4,4,5,6,7];
            document.querySelector("#array").innerText="Array :" + arr;
            function find(){
                let uniqe=[...new Set(arr)];
                document.querySelector("#resulte").innerHTML=`
                unique value = ${uniqe}<br>
                unique count = ${uniqe.length}
                `;
            }

        </script>
    </body>
</html>
